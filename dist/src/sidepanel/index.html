<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JevPilot Side Panel</title>
  <style>:root{--bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-accent:#334155;--text-primary:#f8fafc;--text-muted:#94a3b8;--primary:#8b5cf6;--primary-hover:#7c3aed;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--border:#334155}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}body{background-color:var(--bg-primary);color:var(--text-primary);flex-direction:column;height:100vh;font-size:13px;line-height:1.4;display:flex;overflow:hidden}header{background-color:var(--bg-secondary);border-bottom:1px solid var(--border);justify-content:space-between;align-items:center;padding:12px 14px;display:flex}.brand{align-items:center;gap:8px;font-size:14px;font-weight:600;display:flex}.brand-badge{text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(135deg,#a855f7,#6366f1);border-radius:4px;padding:2px 6px;font-size:10px}.status-badge{background-color:var(--bg-accent);border-radius:9999px;padding:3px 8px;font-size:11px;font-weight:500}.status-idle{color:#94a3b8;background:#334155}.status-planning{color:#93c5fd;background:#1e3a8a}.status-running{color:#6ee7b7;background:#064e3b}.status-paused{color:#fcd34d;background:#78350f}.status-waiting_user{color:#f472b6;background:#831843}.status-completed{color:#34d399;background:#064e3b}.status-failed{color:#fca5a5;background:#7f1d1d}main{flex-direction:column;flex:1;gap:12px;padding:12px;display:flex;overflow-y:auto}.card{background-color:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:12px}.card-title{color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;justify-content:space-between;margin-bottom:8px;font-size:11px;font-weight:600;display:flex}textarea{background-color:var(--bg-primary);border:1px solid var(--border);width:100%;height:68px;color:var(--text-primary);resize:none;border-radius:6px;outline:none;padding:8px;font-size:12px}textarea:focus{border-color:var(--primary)}.btn-group{gap:6px;margin-top:8px;display:flex}button{cursor:pointer;border:none;border-radius:6px;justify-content:center;align-items:center;gap:5px;padding:7px 12px;font-size:12px;font-weight:500;transition:all .15s;display:inline-flex}.btn-primary{background-color:var(--primary);color:#fff;flex:1}.btn-primary:hover{background-color:var(--primary-hover)}.btn-secondary{background-color:var(--bg-accent);color:var(--text-primary)}.btn-secondary:hover{background-color:#475569}.btn-danger{color:#fecaca;background-color:#991b1b}.btn-danger:hover{background-color:#b91c1c}.confidence-meter{background:var(--bg-primary);border-radius:9999px;height:6px;margin:6px 0;overflow:hidden}.confidence-fill{background:var(--success);width:0%;height:100%;transition:width .3s}.log-list{flex-direction:column;gap:8px;max-height:280px;display:flex;overflow-y:auto}.log-item{background:var(--bg-primary);border-left:3px solid var(--primary);border-radius:6px;padding:8px;font-size:11px}.log-item.warning{border-left-color:var(--warning)}.log-item.error{border-left-color:var(--danger)}.log-item.success{border-left-color:var(--success)}.log-header{color:var(--text-muted);justify-content:space-between;margin-bottom:2px;font-size:10px;display:flex}.log-confidence{font-weight:600}.settings-row{flex-direction:column;gap:4px;margin-top:8px;display:flex}.settings-row label{color:var(--text-muted);font-size:11px}.settings-row input{background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);border-radius:4px;outline:none;padding:6px 8px;font-size:12px}.settings-row input:focus{border-color:var(--primary)}.footer-actions{justify-content:space-between;align-items:center;margin-top:4px;display:flex}</style>
  <script type="module" crossorigin src="../../assets/sidepanel.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span>JevPilot</span>
      <span class="brand-badge">System One</span>
    </div>
    <div id="statusBadge" class="status-badge status-idle">IDLE</div>
  </header>

  <main>
    <!-- Task Input Card -->
    <div class="card">
      <div class="card-title">自然语言任务目标</div>
      <textarea id="taskPrompt" placeholder="例如：在 Google 搜索 typesafe ai 并点击进入第一条结果..."></textarea>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary">🚀 启动自动化</button>
        <button id="pauseBtn" class="btn-secondary" style="display: none;">⏸ 暂停</button>
        <button id="resumeBtn" class="btn-secondary" style="display: none;">▶ 继续</button>
        <button id="stopBtn" class="btn-danger" style="display: none;">⏹ 停止</button>
      </div>
    </div>

    <!-- Live Telemetry Card -->
    <div class="card" id="telemetryCard">
      <div class="card-title">
        <span>实时决策仪表盘</span>
        <span id="stepCounter">Step: 0</span>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">Jev 置信度 (Confidence): <span id="confidenceValue">--</span></div>
      <div class="confidence-meter">
        <div id="confidenceFill" class="confidence-fill"></div>
      </div>
      <div id="currentSubgoal" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">等待任务下发...</div>
    </div>

    <!-- Log Stream Card -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
      <div class="card-title">执行轨迹 (Trace)</div>
      <div id="logList" class="log-list">
        <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 20px;">暂无日志</div>
      </div>
    </div>

    <!-- Quick Settings Collapse -->
    <div class="card">
      <div class="card-title">
        <span>API 配置 (冷启动设置)</span>
      </div>
      <div class="settings-row">
        <label>TypeSafe API Key (Jev System One):</label>
        <input type="password" id="typesafeApiKey" placeholder="ts_live_..." />
      </div>
      <div class="settings-row">
        <label>System Two API Key (可选，用于长任务规划):</label>
        <input type="password" id="systemTwoApiKey" placeholder="sk-..." />
      </div>
      <div class="footer-actions">
        <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" id="antiBotCheckbox" checked />
          启用人机贝塞尔鼠标与防风控
        </label>
        <button id="saveConfigBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px;">保存配置</button>
      </div>
    </div>
  </main>

</body>
</html>
