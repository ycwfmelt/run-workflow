<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ang</title>
  <style>:root{--bg-primary:#f8fafc;--bg-card:#fff;--bg-muted:#f1f5f9;--text-primary:#0f172a;--text-secondary:#334155;--text-muted:#64748b;--text-subtle:#94a3b8;--primary:#0f172a;--primary-hover:#1e293b;--accent:#4f46e5;--accent-hover:#4338ca;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--border:#e2e8f0;--border-subtle:#f1f5f9;--shadow-xs:0 1px 2px 0 #0f172a0a;--shadow-sm:0 1px 3px 0 #0f172a0f, 0 1px 2px -1px #0f172a0a;--shadow-md:0 4px 6px -1px #0f172a0f, 0 2px 4px -2px #0f172a0a}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}body{background-color:var(--bg-primary);color:var(--text-primary);flex-direction:column;height:100vh;font-size:13px;line-height:1.45;display:flex;overflow:hidden}header{border-bottom:1px solid var(--border);z-index:10;background-color:#fff;justify-content:space-between;align-items:center;padding:8px 12px;display:flex;box-shadow:0 1px 2px #0f172a08}.brand-title{color:var(--text-primary);letter-spacing:-.01em;font-size:13.5px;font-weight:700}.status-badge{letter-spacing:.02em;border:1px solid #0000;border-radius:9999px;padding:2px 8px;font-size:11px;font-weight:600;transition:all .2s}.status-idle{color:#475569;background:#f1f5f9;border-color:#e2e8f0}.status-planning{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}.status-running{color:#047857;background:#ecfdf5;border-color:#a7f3d0}.status-paused{color:#b45309;background:#fffbeb;border-color:#fde68a}.status-waiting_user{color:#be185d;background:#fdf2f8;border-color:#fbcfe8}.status-completed{color:#047857;background:#ecfdf5;border-color:#a7f3d0}.status-failed{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.s2-badge{cursor:pointer;user-select:none;border:1px solid #0000;border-radius:9999px;align-items:center;gap:5px;padding:2px 8px;font-size:11px;font-weight:500;transition:all .15s;display:inline-flex}.s2-badge:hover{box-shadow:var(--shadow-xs)}.s2-status-dot{border-radius:50%;flex-shrink:0;width:6.5px;height:6.5px}.s2-online{color:#047857;background:#ecfdf5;border-color:#a7f3d0}.s2-online .s2-status-dot{background:#10b981;box-shadow:0 0 0 2px #10b98140}.s2-offline{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.s2-offline .s2-status-dot{background:#ef4444}.s2-warn{color:#b45309;background:#fffbeb;border-color:#fde68a}.s2-warn .s2-status-dot{background:#f59e0b}.s2-unknown{color:#64748b;background:#f1f5f9;border-color:#e2e8f0}.s2-unknown .s2-status-dot{background:#94a3b8}main{flex-direction:column;flex:1;gap:8px;padding:10px 12px;display:flex;overflow-y:auto}.card{background-color:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-xs);border-radius:8px;padding:10px 12px;transition:border-color .15s}.card:hover{border-color:#cbd5e1}.card-title{color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;font-weight:600;display:flex}textarea{border:1px solid var(--border);width:100%;height:60px;color:var(--text-primary);resize:none;background-color:#fff;border-radius:6px;outline:none;padding:7px 9px;font-size:12px;line-height:1.45;transition:all .15s;box-shadow:inset 0 1px 2px #0f172a08}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f46e51f}textarea::placeholder{color:var(--text-subtle)}.btn-group{gap:6px;margin-top:8px;display:flex}button{cursor:pointer;user-select:none;border:none;border-radius:6px;justify-content:center;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:500;transition:all .15s;display:inline-flex}button:active{transform:scale(.98)}.btn-primary{background-color:var(--primary);color:#fff;border:1px solid var(--primary);box-shadow:var(--shadow-xs);flex:1}.btn-primary:hover{background-color:var(--primary-hover);border-color:var(--primary-hover)}.btn-secondary{color:var(--text-secondary);border:1px solid var(--border);box-shadow:var(--shadow-xs);background-color:#fff}.btn-secondary:hover{background-color:var(--bg-muted);color:var(--text-primary);border-color:#cbd5e1}.btn-danger{color:#dc2626;background-color:#fef2f2;border:1px solid #fecaca}.btn-danger:hover{background-color:#fee2e2;border-color:#fca5a5}.confidence-meter{background:var(--bg-muted);border:1px solid var(--border);border-radius:9999px;height:6px;margin:8px 0 6px;overflow:hidden}.confidence-fill{background:var(--success);border-radius:9999px;width:0%;height:100%;transition:width .3s,background .3s}.log-list{flex-direction:column;gap:8px;max-height:280px;padding-right:2px;display:flex;overflow-y:auto}.log-item{border:1px solid var(--border);border-left:3.5px solid var(--accent);box-shadow:var(--shadow-xs);background:#fff;border-radius:8px;padding:9px 12px;font-size:11.5px;line-height:1.45;transition:all .15s}.log-item:hover{box-shadow:var(--shadow-sm);border-color:#cbd5e1}.log-item.warning{border-left-color:var(--warning);background:#fffdf7}.log-item.error{border-left-color:var(--danger);background:#fef8f8}.log-item.success{border-left-color:var(--success);background:#f9fdfa}.log-header{color:var(--text-muted);justify-content:space-between;margin-bottom:3px;font-size:10.5px;font-weight:500;display:flex}.log-confidence{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:600}.header-right{align-items:center;gap:7px;display:flex}.btn-icon{border:1px solid var(--border);color:var(--text-muted);cursor:pointer;box-shadow:var(--shadow-xs);background:#fff;border-radius:8px;justify-content:center;align-items:center;padding:5px 7px;font-size:13px;line-height:1;transition:all .15s;display:inline-flex}.btn-icon:hover{background:var(--bg-muted);color:var(--text-primary);border-color:#cbd5e1}.api-key-banner{box-shadow:var(--shadow-xs);background:#fffbeb;border:1px solid #fde68a;border-radius:10px;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;display:flex}.code-stepper-wrapper{background:#090d16;border:1px solid #1e293b;border-radius:8px;max-height:180px;font-family:JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;line-height:1.6;position:relative;overflow-y:auto}.code-line-row{white-space:pre;padding:0 4px;transition:background .15s,border-color .15s;display:flex}.code-line-num{color:#475569;text-align:right;user-select:none;border-right:1px solid #1e293b;flex-shrink:0;width:28px;margin-right:6px;padding-right:6px}.code-line-text{color:#cbd5e1;flex:1;overflow-x:auto}.code-line-row.active-line{background:#6366f147;border-left:3px solid #818cf8;margin-left:-3px}.code-line-row.active-line .code-line-num{color:#818cf8;font-weight:700}.code-line-row.active-line .code-line-text{color:#fff;font-weight:600}</style>
  <script type="module" crossorigin src="../../assets/sidepanel.js"></script>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="brand-title">Ang</span>
      <div id="statusBadge" class="status-badge status-idle">IDLE</div>
      <div id="s2StatusBadge" class="s2-badge s2-unknown" title="S2 (Ollama) 模型服务状态，点击刷新检测">
        <span class="s2-status-dot"></span>
        <span id="s2StatusText">S2: 检测中...</span>
      </div>
    </div>
    <div class="header-right">
      <button id="openOptionsBtn" class="btn-icon" title="设置 (API Key / 模型配置)">⚙️</button>
      <button id="closeSidePanelBtn" class="btn-icon" title="关闭侧边栏" style="font-size: 12px; line-height: 1; padding: 4px 6px;">✕</button>
    </div>
  </header>

  <main>
    <!-- Unconfigured API Key Alert Banner -->
    <div id="apiKeyBanner" class="api-key-banner" style="display: none;">
      <div>
        <div style="font-weight: 600; font-size: 12px; color: #92400e;">⚠️ 未配置 TypeSafe API Key</div>
        <div style="font-size: 11px; color: #b45309; margin-top: 2px;">请先配置 API Key 以启用 System One 决策</div>
      </div>
      <button id="bannerSettingsBtn" class="btn-primary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #d97706; border-color: #d97706; color: #fff;">前往设置 ⚙️</button>
    </div>

    <!-- S2 / Ollama Status Warning Banner -->
    <div id="s2Banner" class="api-key-banner" style="display: none; background: #fef2f2; border: 1px solid #fecaca;">
      <div style="flex: 1; min-width: 0;">
        <div id="s2BannerTitle" style="font-weight: 600; font-size: 12px; color: #991b1b;">🔴 S2 服务不可用</div>
        <div id="s2BannerDesc" style="font-size: 11px; color: #b91c1c; margin-top: 2px; line-height: 1.4;">
          无法连接到本地 Ollama 服务。
        </div>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="s2RetryBtn" class="btn-primary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #dc2626; border-color: #dc2626; color: #fff;">重试</button>
        <button id="s2SettingsBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #ffffff; color: #991b1b; border-color: #fecaca;">设置</button>
      </div>
    </div>

    <!-- Task Input Card -->
    <div class="card">
      <div class="card-title">任务目标</div>
      <textarea id="taskPrompt" placeholder="输入自动化任务，例如：在 Google 搜索 typesafe ai 并点击第一条结果..."></textarea>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary">启动自动化</button>
        <button id="diagnoseBtn" class="btn-secondary" title="扫描当前网页的 Iframe、Shadow DOM 及交互元素">页面诊断</button>
        <button id="pauseBtn" class="btn-secondary" style="display: none;">暂停</button>
        <button id="resumeBtn" class="btn-secondary" style="display: none;">继续</button>
        <button id="stopBtn" class="btn-danger" style="display: none;">停止</button>
      </div>
    </div>

    <!-- Dynamic Workflows Card -->
    <div class="card" id="workflowsCard" style="display: none; border-color: #c7d2fe;">
      <div class="card-title" style="color: #3730a3; display: flex; justify-content: space-between; align-items: center;">
        <span>适用工作流 (Recipes)</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 10px; background: #e0e7ff; color: #3730a3; padding: 1px 6px; border-radius: 9999px; font-weight: 600; border: 1px solid #c7d2fe;">Recipe</span>
          <button id="manageWorkflowsBtn" class="btn-icon" title="管理工作流匹配规则与脚本" style="font-size: 11px; padding: 2px 6px;">⚙️ 管理</button>
        </div>
      </div>
      <div id="workflowList" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;"></div>
    </div>

    <!-- Live Workflow Code Stepper Card -->
    <div class="card" id="codeStepperCard" style="display: none; border-color: #c7d2fe;">
      <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="color: #3730a3;">代码执行监视</span>
          <span id="activeLineBadge" style="font-size: 10px; background: #e0e7ff; color: #3730a3; padding: 1px 6px; border-radius: 9999px; font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; border: 1px solid #c7d2fe;">Line --</span>
        </div>
        <button id="toggleStepperCodeBtn" class="btn-icon" style="font-size: 10px; padding: 2px 6px;" title="收起/展开代码">收起 ⏶</button>
      </div>
      <div id="codeStepperContent" class="code-stepper-wrapper">
        <div id="codeLinesContainer"></div>
      </div>
    </div>

    <!-- Active Execution Telemetry (Only shown during task execution) -->
    <div class="card" id="telemetryCard" style="display: none; padding: 8px 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
        <span id="stepCounter" style="font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; color: #4f46e5;">Step: 0</span>
        <span style="color: var(--text-muted);">置信度: <strong id="confidenceValue" style="color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, monospace;">--</strong></span>
      </div>
      <div class="confidence-meter" style="margin: 4px 0;">
        <div id="confidenceFill" class="confidence-fill"></div>
      </div>
      <div id="currentSubgoal" style="font-size: 11.5px; color: var(--text-secondary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">准备就绪</div>
    </div>

    <!-- Save Workflow Recipe Banner -->
    <div id="saveWorkflowBanner" class="card" style="display: none; background: #eef2ff; border-color: #c7d2fe;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 600; font-size: 12px; color: #3730a3;">动态工作流执行完成</div>
          <div id="saveWorkflowDesc" style="font-size: 11px; color: #4338ca; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">可保存为此页面的快捷 Recipe</div>
        </div>
        <button id="saveWorkflowBtn" class="btn-primary" style="padding: 5px 10px; font-size: 11px; white-space: nowrap; background: #4f46e5; border-color: #4f46e5; color: #ffffff;">
          保存为本地 Recipe
        </button>
      </div>
    </div>

    <!-- Log Stream Card -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span>执行轨迹</span>
        <button id="copyTraceBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">📋 复制</button>
      </div>
      <div id="logList" class="log-list" style="flex: 1;">
        <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 24px;">暂无日志</div>
      </div>
    </div>

    <!-- Debug Inspector Card (Shown on demand) -->
    <div class="card" id="debugCard" style="display: none;">
      <div class="card-title" style="margin-bottom: 6px;">
        <span>页面诊断与 DOM 探查</span>
        <div style="display: flex; gap: 6px;">
          <button id="copyDebugBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">📋 复制</button>
          <button id="closeDebugBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">✕ 关闭</button>
        </div>
      </div>
      <div id="diagnoseResult" style="font-size: 11px; color: #334155; max-height: 160px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; line-height: 1.45; white-space: pre-wrap; background: #f8fafc; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);"></div>
    </div>

  </main>

</body>
</html>
