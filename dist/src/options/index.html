<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>JevPilot Settings</title>
  <style>body{color:#f8fafc;background-color:#0f172a;max-width:680px;margin:0 auto;padding:40px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;line-height:1.5}h1{color:#a855f7;align-items:center;gap:8px;margin-bottom:24px;font-size:22px;display:flex}.section{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:20px;padding:20px}.section-title{color:#cbd5e1;border-bottom:1px solid #334155;margin-bottom:16px;padding-bottom:8px;font-size:14px;font-weight:600}.form-group{margin-bottom:14px}label{color:#94a3b8;margin-bottom:6px;font-size:12px;display:block}input[type=text],input[type=password],select{color:#f8fafc;box-sizing:border-box;background:#0f172a;border:1px solid #334155;border-radius:6px;outline:none;width:100%;padding:8px 12px;font-size:13px}input:focus,select:focus{border-color:#a855f7}.checkbox-label{color:#e2e8f0;cursor:pointer;align-items:center;gap:8px;font-size:13px;display:flex}button{color:#fff;cursor:pointer;background:#8b5cf6;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:600}button:hover{background:#7c3aed}#status{color:#10b981;margin-left:12px;font-size:13px}</style>
  <script type="module" crossorigin src="../../assets/options.js"></script>
</head>
<body>
  <h1>JevPilot 全局参数配置</h1>

  <div class="section">
    <div class="section-title">TypeSafe Jev (System One) 配置</div>
    <div class="form-group">
      <label>TypeSafe API Key:</label>
      <input type="password" id="typesafeApiKey" placeholder="ts_live_..." />
    </div>
    <div class="form-group">
      <label>Model Version:</label>
      <select id="typesafeModel">
        <option value="jev-latest">jev-latest (Recommended)</option>
        <option value="jev-1.13">jev-1.13</option>
        <option value="jev-1.12">jev-1.12</option>
      </select>
    </div>
    <div class="form-group">
      <label>置信度阈值 (Confidence Threshold, 默认 0.70):</label>
      <input type="text" id="confidenceThreshold" value="0.70" />
    </div>
  </div>

  <div class="section">
    <div class="section-title">System Two (冷启动规划模型)</div>
    <div class="form-group">
      <label>Provider:</label>
      <select id="systemTwoProvider">
        <option value="none">None (内置启发式规则解析)</option>
        <option value="openai">OpenAI 兼容 API (GPT-4o, Gemini, DeepSeek)</option>
      </select>
    </div>
    <div class="form-group">
      <label>API Endpoint:</label>
      <input type="text" id="systemTwoEndpoint" value="https://api.openai.com/v1" />
    </div>
    <div class="form-group">
      <label>API Key:</label>
      <input type="password" id="systemTwoApiKey" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>Model Name:</label>
      <input type="text" id="systemTwoModel" value="gpt-4o-mini" />
    </div>
  </div>

  <div class="section">
    <div class="section-title">人机防风控设置 (Anti-Bot Emulation)</div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="antiBotMode" checked />
        启用三次贝塞尔曲线鼠标轨迹与高斯击键延迟 (CDP Hardware Emulation)
      </label>
    </div>
  </div>

  <button id="saveBtn">保存全部配置</button>
  <span id="status"></span>

</body>
</html>
