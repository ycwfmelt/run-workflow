<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JevPilot Side Panel</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-accent: #334155;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 14px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
      background-color: var(--bg-accent);
    }
    .status-idle { background: #334155; color: #94a3b8; }
    .status-planning { background: #1e3a8a; color: #93c5fd; }
    .status-running { background: #064e3b; color: #6ee7b7; }
    .status-paused { background: #78350f; color: #fcd34d; }
    .status-waiting_user { background: #831843; color: #f472b6; }
    .status-completed { background: #064e3b; color: #34d399; }
    .status-failed { background: #7f1d1d; color: #fca5a5; }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      height: 68px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 8px;
      font-size: 12px;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
      flex: 1;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: var(--bg-accent);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background-color: #475569; }

    .btn-danger {
      background-color: #991b1b;
      color: #fecaca;
    }
    .btn-danger:hover { background-color: #b91c1c; }

    /* Telemetry */
    .confidence-meter {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 9999px;
      overflow: hidden;
      margin: 6px 0;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    /* Logs timeline */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .log-item {
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-primary);
      border-left: 3px solid var(--primary);
    }

    .log-item.warning { border-left-color: var(--warning); }
    .log-item.error { border-left-color: var(--danger); }
    .log-item.success { border-left-color: var(--success); }

    .log-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 10px;
      margin-bottom: 2px;
    }

    .log-confidence {
      font-weight: 600;
    }

    /* Settings section */
    .settings-row {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings-row label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .settings-row input {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .settings-row input:focus {
      border-color: var(--primary);
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>JevPilot</span>
      <span class="brand-badge">System One</span>
    </div>
    <div id="statusBadge" class="status-badge status-idle">IDLE</div>
  </header>

  <main>
    <!-- Task Input Card -->
    <div class="card">
      <div class="card-title">自然语言任务目标</div>
      <textarea id="taskPrompt" placeholder="例如：在 Google 搜索 typesafe ai 并点击进入第一条结果..."></textarea>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary">🚀 启动自动化</button>
        <button id="pauseBtn" class="btn-secondary" style="display: none;">⏸ 暂停</button>
        <button id="resumeBtn" class="btn-secondary" style="display: none;">▶ 继续</button>
        <button id="stopBtn" class="btn-danger" style="display: none;">⏹ 停止</button>
      </div>
    </div>

    <!-- Live Telemetry Card -->
    <div class="card" id="telemetryCard">
      <div class="card-title">
        <span>实时决策仪表盘</span>
        <span id="stepCounter">Step: 0</span>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">Jev 置信度 (Confidence): <span id="confidenceValue">--</span></div>
      <div class="confidence-meter">
        <div id="confidenceFill" class="confidence-fill"></div>
      </div>
      <div id="currentSubgoal" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">等待任务下发...</div>
    </div>

    <!-- Log Stream Card -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
      <div class="card-title">执行轨迹 (Trace)</div>
      <div id="logList" class="log-list">
        <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 20px;">暂无日志</div>
      </div>
    </div>

    <!-- Quick Settings Collapse -->
    <div class="card">
      <div class="card-title">
        <span>API 配置 (冷启动设置)</span>
      </div>
      <div class="settings-row">
        <label>TypeSafe API Key (Jev System One):</label>
        <input type="password" id="typesafeApiKey" placeholder="ts_live_..." />
      </div>
      <div class="settings-row">
        <label>System Two API Key (可选，用于长任务规划):</label>
        <input type="password" id="systemTwoApiKey" placeholder="sk-..." />
      </div>
      <div class="footer-actions">
        <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" id="antiBotCheckbox" checked />
          启用人机贝塞尔鼠标与防风控
        </label>
        <button id="saveConfigBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px;">保存配置</button>
      </div>
    </div>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
