<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ang</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 8px 12px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .status-idle { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .status-planning { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .status-running { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .status-paused { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .status-waiting_user { background: #fdf2f8; color: #be185d; border-color: #fbcfe8; }
    .status-completed { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .status-failed { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

    .s2-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      border: 1px solid transparent;
    }
    .s2-badge:hover {
      box-shadow: var(--shadow-xs);
    }
    .s2-status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .s2-online { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .s2-online .s2-status-dot { background: #10b981; }
    .s2-online .s2-status-dot { background: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25); }
    .s2-offline { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .s2-offline .s2-status-dot { background: #ef4444; }
    .s2-warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .s2-warn .s2-status-dot { background: #f59e0b; }
    .s2-unknown { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
    .s2-unknown .s2-status-dot { background: #94a3b8; }

    main {
      flex: 1;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s ease;
    }
    .card:hover {
      border-color: #cbd5e1;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 60px;
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 7px 9px;
      font-size: 12px;
      line-height: 1.45;
      resize: none;
      outline: none;
      transition: all 0.15s ease;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    textarea::placeholder {
      color: var(--text-subtle);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }
    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      flex: 1;
      box-shadow: var(--shadow-xs);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    .btn-secondary:hover {
      background-color: var(--bg-muted);
      border-color: #cbd5e1;
      color: var(--text-primary);
    }

    .btn-danger {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .btn-danger:hover {
      background-color: #fee2e2;
      border-color: #fca5a5;
    }

    /* Telemetry */
    .confidence-meter {
      height: 6px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin: 8px 0 6px 0;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      border-radius: 9999px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Logs timeline */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-item {
      font-size: 11.5px;
      line-height: 1.45;
      padding: 9px 12px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 3.5px solid var(--accent);
      box-shadow: var(--shadow-xs);
      transition: all 0.15s ease;
    }
    .log-item:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }

    .log-item.warning {
      border-left-color: var(--warning);
      background: #fffdf7;
    }
    .log-item.error {
      border-left-color: var(--danger);
      background: #fef8f8;
    }
    .log-item.success {
      border-left-color: var(--success);
      background: #f9fdfa;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .log-confidence {
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn-icon {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 5px 7px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-xs);
    }
    .btn-icon:hover {
      background: var(--bg-muted);
      color: var(--text-primary);
      border-color: #cbd5e1;
    }

    .api-key-banner {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-xs);
    }

    /* Live Code Stepper */
    .code-stepper-wrapper {
      max-height: 180px;
      overflow-y: auto;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      position: relative;
    }
    .code-line-row {
      display: flex;
      padding: 0 4px;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: pre;
    }
    .code-line-num {
      width: 28px;
      color: #475569;
      text-align: right;
      padding-right: 6px;
      user-select: none;
      flex-shrink: 0;
      border-right: 1px solid #1e293b;
      margin-right: 6px;
    }
    .code-line-text {
      color: #cbd5e1;
      flex: 1;
      overflow-x: auto;
    }
    .code-line-row.active-line {
      background: rgba(99, 102, 241, 0.28);
      border-left: 3px solid #818cf8;
      margin-left: -3px;
    }
    .code-line-row.active-line .code-line-num {
      color: #818cf8;
      font-weight: 700;
    }
    .code-line-row.active-line .code-line-text {
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="brand-title">Ang</span>
      <div id="statusBadge" class="status-badge status-idle">IDLE</div>
      <div id="s2StatusBadge" class="s2-badge s2-unknown" title="S2 (Ollama) 模型服务状态，点击刷新检测">
        <span class="s2-status-dot"></span>
        <span id="s2StatusText">S2: 检测中...</span>
      </div>
    </div>
    <div class="header-right">
      <button id="openOptionsBtn" class="btn-icon" title="设置 (API Key / 模型配置)">⚙️</button>
      <button id="closeSidePanelBtn" class="btn-icon" title="关闭侧边栏" style="font-size: 12px; line-height: 1; padding: 4px 6px;">✕</button>
    </div>
  </header>

  <main>
    <!-- Unconfigured API Key Alert Banner -->
    <div id="apiKeyBanner" class="api-key-banner" style="display: none;">
      <div>
        <div style="font-weight: 600; font-size: 12px; color: #92400e;">⚠️ 未配置 TypeSafe API Key</div>
        <div style="font-size: 11px; color: #b45309; margin-top: 2px;">请先配置 API Key 以启用 System One 决策</div>
      </div>
      <button id="bannerSettingsBtn" class="btn-primary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #d97706; border-color: #d97706; color: #fff;">前往设置 ⚙️</button>
    </div>

    <!-- S2 / Ollama Status Warning Banner -->
    <div id="s2Banner" class="api-key-banner" style="display: none; background: #fef2f2; border: 1px solid #fecaca;">
      <div style="flex: 1; min-width: 0;">
        <div id="s2BannerTitle" style="font-weight: 600; font-size: 12px; color: #991b1b;">🔴 S2 服务不可用</div>
        <div id="s2BannerDesc" style="font-size: 11px; color: #b91c1c; margin-top: 2px; line-height: 1.4;">
          无法连接到本地 Ollama 服务。
        </div>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="s2RetryBtn" class="btn-primary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #dc2626; border-color: #dc2626; color: #fff;">重试</button>
        <button id="s2SettingsBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #ffffff; color: #991b1b; border-color: #fecaca;">设置</button>
      </div>
    </div>

    <!-- Task Input Card -->
    <div class="card">
      <div class="card-title">任务目标</div>
      <textarea id="taskPrompt" placeholder="输入自动化任务，例如：在 Google 搜索 typesafe ai 并点击第一条结果..."></textarea>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary">启动自动化</button>
        <button id="diagnoseBtn" class="btn-secondary" title="扫描当前网页的 Iframe、Shadow DOM 及交互元素">页面诊断</button>
        <button id="pauseBtn" class="btn-secondary" style="display: none;">暂停</button>
        <button id="resumeBtn" class="btn-secondary" style="display: none;">继续</button>
        <button id="stopBtn" class="btn-danger" style="display: none;">停止</button>
      </div>
    </div>

    <!-- Dynamic Workflows Card -->
    <div class="card" id="workflowsCard" style="display: none; border-color: #c7d2fe;">
      <div class="card-title" style="color: #3730a3; display: flex; justify-content: space-between; align-items: center;">
        <span>适用工作流 (Recipes)</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 10px; background: #e0e7ff; color: #3730a3; padding: 1px 6px; border-radius: 9999px; font-weight: 600; border: 1px solid #c7d2fe;">Recipe</span>
          <button id="manageWorkflowsBtn" class="btn-icon" title="管理工作流匹配规则与脚本" style="font-size: 11px; padding: 2px 6px;">⚙️ 管理</button>
        </div>
      </div>
      <div id="workflowList" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;"></div>
    </div>

    <!-- Live Workflow Code Stepper Card -->
    <div class="card" id="codeStepperCard" style="display: none; border-color: #c7d2fe;">
      <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="color: #3730a3;">代码执行监视</span>
          <span id="activeLineBadge" style="font-size: 10px; background: #e0e7ff; color: #3730a3; padding: 1px 6px; border-radius: 9999px; font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; border: 1px solid #c7d2fe;">Line --</span>
        </div>
        <button id="toggleStepperCodeBtn" class="btn-icon" style="font-size: 10px; padding: 2px 6px;" title="收起/展开代码">收起 ⏶</button>
      </div>
      <div id="codeStepperContent" class="code-stepper-wrapper">
        <div id="codeLinesContainer"></div>
      </div>
    </div>

    <!-- Active Execution Telemetry (Only shown during task execution) -->
    <div class="card" id="telemetryCard" style="display: none; padding: 8px 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
        <span id="stepCounter" style="font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; color: #4f46e5;">Step: 0</span>
        <span style="color: var(--text-muted);">置信度: <strong id="confidenceValue" style="color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, monospace;">--</strong></span>
      </div>
      <div class="confidence-meter" style="margin: 4px 0;">
        <div id="confidenceFill" class="confidence-fill"></div>
      </div>
      <div id="currentSubgoal" style="font-size: 11.5px; color: var(--text-secondary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">准备就绪</div>
    </div>

    <!-- Save Workflow Recipe Banner -->
    <div id="saveWorkflowBanner" class="card" style="display: none; background: #eef2ff; border-color: #c7d2fe;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 600; font-size: 12px; color: #3730a3;">动态工作流执行完成</div>
          <div id="saveWorkflowDesc" style="font-size: 11px; color: #4338ca; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">可保存为此页面的快捷 Recipe</div>
        </div>
        <button id="saveWorkflowBtn" class="btn-primary" style="padding: 5px 10px; font-size: 11px; white-space: nowrap; background: #4f46e5; border-color: #4f46e5; color: #ffffff;">
          保存为本地 Recipe
        </button>
      </div>
    </div>

    <!-- Log Stream Card -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span>执行轨迹</span>
        <button id="copyTraceBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">📋 复制</button>
      </div>
      <div id="logList" class="log-list" style="flex: 1;">
        <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 24px;">暂无日志</div>
      </div>
    </div>

    <!-- Debug Inspector Card (Shown on demand) -->
    <div class="card" id="debugCard" style="display: none;">
      <div class="card-title" style="margin-bottom: 6px;">
        <span>页面诊断与 DOM 探查</span>
        <div style="display: flex; gap: 6px;">
          <button id="copyDebugBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">📋 复制</button>
          <button id="closeDebugBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 10px;">✕ 关闭</button>
        </div>
      </div>
      <div id="diagnoseResult" style="font-size: 11px; color: #334155; max-height: 160px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; line-height: 1.45; white-space: pre-wrap; background: #f8fafc; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);"></div>
    </div>

  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
