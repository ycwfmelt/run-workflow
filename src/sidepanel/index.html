<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ang</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-accent: #334155;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 14px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
      background-color: var(--bg-accent);
    }
    .status-idle { background: #334155; color: #94a3b8; }
    .status-planning { background: #1e3a8a; color: #93c5fd; }
    .status-running { background: #064e3b; color: #6ee7b7; }
    .status-paused { background: #78350f; color: #fcd34d; }
    .status-waiting_user { background: #831843; color: #f472b6; }
    .status-completed { background: #064e3b; color: #34d399; }
    .status-failed { background: #7f1d1d; color: #fca5a5; }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      height: 68px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 8px;
      font-size: 12px;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
      flex: 1;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: var(--bg-accent);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background-color: #475569; }

    .btn-danger {
      background-color: #991b1b;
      color: #fecaca;
    }
    .btn-danger:hover { background-color: #b91c1c; }

    /* Telemetry */
    .confidence-meter {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 9999px;
      overflow: hidden;
      margin: 6px 0;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    /* Logs timeline */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .log-item {
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-primary);
      border-left: 3px solid var(--primary);
    }

    .log-item.warning { border-left-color: var(--warning); }
    .log-item.error { border-left-color: var(--danger); }
    .log-item.success { border-left-color: var(--success); }

    .log-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 10px;
      margin-bottom: 2px;
    }

    .log-confidence {
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 4px 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-icon:hover {
      background: var(--bg-accent);
      color: var(--text-primary);
      border-color: var(--primary);
    }

    .api-key-banner {
      background: #451a03;
      border: 1px solid #b45309;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius: 5px; flex-shrink: 0;">
        <rect width="128" height="128" rx="28" fill="#090d16"/>
        <path d="M34 94 L64 28 L94 94" stroke="url(#h-accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="47" y1="68" x2="81" y2="68" stroke="url(#h-accent)" stroke-width="8" stroke-linecap="round"/>
        <circle cx="64" cy="46" r="3.5" fill="#38bdf8"/>
        <defs>
          <linearGradient id="h-accent" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="60%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Ang</span>
      <span class="brand-badge">Pilot</span>
    </div>
    <div class="header-right">
      <div id="statusBadge" class="status-badge status-idle">IDLE</div>
      <button id="openOptionsBtn" class="btn-icon" title="打开全局配置 (API Key / 模型设置)">⚙️</button>
    </div>
  </header>

  <main>
    <!-- Unconfigured API Key Alert Banner -->
    <div id="apiKeyBanner" class="api-key-banner" style="display: none;">
      <div>
        <div style="font-weight: 600; font-size: 12px; color: #fef08a;">⚠️ 未配置 TypeSafe API Key</div>
        <div style="font-size: 11px; color: #fde68a; margin-top: 2px;">请先配置 API Key 以启用 System One 决策</div>
      </div>
      <button id="bannerSettingsBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; background: #d97706; color: #fff; border: none;">前往设置 ⚙️</button>
    </div>

    <!-- Task Input Card -->
    <div class="card">
      <div class="card-title">自然语言任务目标</div>
      <textarea id="taskPrompt" placeholder="例如：在 Google 搜索 typesafe ai 并点击进入第一条结果..."></textarea>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary">🚀 启动自动化</button>
        <button id="diagnoseBtn" class="btn-secondary" title="扫描当前网页的 Iframe、Shadow DOM 及所有交互元素">🔍 诊断页面</button>
        <button id="pauseBtn" class="btn-secondary" style="display: none;">⏸ 暂停</button>
        <button id="resumeBtn" class="btn-secondary" style="display: none;">▶ 继续</button>
        <button id="stopBtn" class="btn-danger" style="display: none;">⏹ 停止</button>
      </div>
    </div>

    <!-- Dynamic Workflows Card -->
    <div class="card" id="workflowsCard" style="display: none; border-color: #6366f1;">
      <div class="card-title" style="color: #a5b4fc; display: flex; justify-content: space-between; align-items: center;">
        <span>⚡ 适用当前页面的动态工作流</span>
        <span style="font-size: 10px; background: #312e81; color: #c7d2fe; padding: 2px 6px; border-radius: 4px;">JS Recipe</span>
      </div>
      <div id="workflowList" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;"></div>
    </div>

    <!-- Live Telemetry Card -->
    <div class="card" id="telemetryCard">
      <div class="card-title">
        <span>实时决策仪表盘</span>
        <span id="stepCounter">Step: 0</span>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">Jev 置信度 (Confidence): <span id="confidenceValue">--</span></div>
      <div class="confidence-meter">
        <div id="confidenceFill" class="confidence-fill"></div>
      </div>
      <div id="currentSubgoal" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">等待任务下发...</div>
    </div>

    <!-- Log Stream Card -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
      <div class="card-title">执行轨迹 (Trace)</div>
      <div id="logList" class="log-list">
        <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 20px;">暂无日志</div>
      </div>
    </div>

    <!-- Debug Inspector Card -->
    <div class="card" id="debugCard">
      <div class="card-title">
        <span>页面诊断与 DOM 探查 (Debug Inspector)</span>
        <button id="copyDebugBtn" class="btn-secondary" style="padding: 2px 6px; font-size: 10px;">📋 复制日志</button>
      </div>
      <div id="diagnoseResult" style="font-size: 11px; color: #94a3b8; max-height: 140px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; background: #0b1120; padding: 8px; border-radius: 4px; border: 1px solid #1e293b;">
点击上方【🔍 诊断页面】可实时探测当前标签页的 Iframes、Shadow DOM 及提取到的元素列表。
      </div>
    </div>

  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
